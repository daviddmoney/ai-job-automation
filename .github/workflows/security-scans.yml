name: Security scans
on:
  push:
    branches: [main, feature/global-multilingual-security]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run npm audit and save JSON report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit reported vulnerabilities or an audit error."
            exit "$audit_status"
          fi
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-audit-report-${{ github.run_number }}
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 30

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Scan source and generate SARIF
        run: semgrep scan --config p/security-audit --sarif --output semgrep.sarif --error src
      - name: Upload Semgrep SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-sarif-${{ github.run_number }}
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  snyk:
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Snyk CLI
        run: npm install --global snyk
      - name: Run Snyk vulnerability scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high
