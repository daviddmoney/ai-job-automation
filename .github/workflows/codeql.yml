name: CodeQL

on:
  push:
    branches: [main, feature/global-multilingual-security]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          # This private repository currently has GitHub code scanning disabled.
          # Keep running CodeQL queries in CI, but skip SARIF upload until the
          # repository has code-scanning entitlement and the feature is enabled.
          upload: false
