name: CodeQL

on:
  push:
    branches: [main, feature/global-multilingual-security]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/autobuild@v4

      - name: Analyze and save SARIF report
        uses: github/codeql-action/analyze@v4
        with:
          # Publish the SARIF results to GitHub Code Scanning.
          # The repository must have GitHub Code Security enabled for private-repo upload.
          upload: true
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif

      - name: Upload CodeQL SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ github.run_number }}
          path: ${{ runner.temp }}/codeql-sarif/
          if-no-files-found: warn
          retention-days: 30
