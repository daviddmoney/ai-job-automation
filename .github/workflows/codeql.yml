name: CodeQL

on:
  push:
    branches: [main, integration/global-multilingual-security-2026-11-15]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Build
        uses: github/codeql-action/autobuild@v4

      - name: Analyze and upload findings to GitHub Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: always
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif

      - name: Preserve SARIF artifact for audit and troubleshooting
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-sarif-${{ github.run_number }}
          path: ${{ runner.temp }}/codeql-sarif/
          if-no-files-found: warn
          retention-days: 30
