name: Generate and commit npm lockfile

on:
  push:
    branches:
      - feature/global-multilingual-security
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          if [ ! -s package-lock.json ]; then
            echo "package-lock.json was not generated."
            exit 1
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          if git cat-file -e "origin/${GITHUB_REF_NAME}:package-lock.json" 2>/dev/null; then
            echo "A concurrent run already committed a lockfile; using the branch version."
            git show "origin/${GITHUB_REF_NAME}:package-lock.json" > package-lock.json
          else
            git add package-lock.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add generated npm package lockfile"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify lockfile installation and application
        run: |
          npm ci
          npx prisma generate
          npm test
          npm run typecheck
          npm run build

      - name: Upload generated lockfile for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.run_number }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 30
