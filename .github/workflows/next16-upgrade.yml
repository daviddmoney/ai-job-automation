name: Next.js 16.4.6 upgrade

on:
  push:
    branches: [feature/global-multilingual-security]
    paths:
      - ".github/UPGRADE_NEXT_16"

permissions:
  contents: write

concurrency:
  group: next16-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    if: ${{ github.actor == 'daviddmoney' && github.event.head_commit.message == 'Request Next.js 16.4.6 upgrade' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-for-tests-123456
      AUTH_URL: http://localhost:3000
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-multilingual-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next.js and aligned React packages
        run: |
          npm install --save-exact next@16.4.6 react@latest react-dom@latest
          npm install --save-dev --save-exact @types/react@latest @types/react-dom@latest
      - name: Migrate asynchronous Next.js request APIs
        env:
          CI: "true"
        run: npx --yes @next/codemod@canary next-async-request-api . --force
      - name: Apply compatible dependency security fixes
        run: npm audit fix
      - name: Generate Next.js and Prisma types
        run: |
          npx next typegen
          npx prisma generate
      - name: Run automated tests
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production application
        run: npm run build
      - name: Run npm audit
        run: npm audit --audit-level=high
      - name: Verify Snyk reports no high or critical vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required to validate this security upgrade."
            exit 1
          fi
          npm install --global snyk
          snyk test --all-projects --severity-threshold=high
      - name: Commit verified migration to feature branch
        run: |
          rm .github/UPGRADE_NEXT_16
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 1
          fi
          git commit -m "Upgrade Next.js to 16.4.6 and migrate async APIs"
          git push origin HEAD:feature/global-multilingual-security
