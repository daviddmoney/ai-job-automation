name: Pre-publication secret audit

on:
  push:
    branches: [main, feature/global-multilingual-security]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-publication-secret-audit
  cancel-in-progress: false

jobs:
  full-history-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout all refs and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the checkout contains commit history and branch refs
        shell: bash
        run: |
          set -euo pipefail
          count="$(git rev-list --all --count)"
          branches="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort)"
          tags="$(git for-each-ref --format='%(refname:short)' refs/tags/ | sort)"
          echo "Reachable commit count: $count"
          echo "Fetched remote branches:"
          printf '%s\n' "$branches"
          echo "Fetched tags:"
          printf '%s\n' "$tags"
          if [ "$count" -lt 2 ]; then
            echo "::error::Checkout does not contain enough history to perform a meaningful full-history scan."
            exit 1
          fi
          if [ -z "$branches" ]; then
            echo "::error::No remote branches were fetched; refusing to claim a full-history scan."
            exit 1
          fi

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every fetched branch and tag history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git \
            --config=".gitleaks.toml" \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-history.sarif" \
            .

      - name: Preserve redacted scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pre-publication-gitleaks-history-${{ github.run_number }}
          path: ${{ runner.temp }}/gitleaks-history.sarif
          if-no-files-found: warn
          retention-days: 30
